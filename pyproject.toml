[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "liberado-python-interpreter-mcp"
version = "0.1.0"
description = "MCP server for secure Python code execution and package management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "turbomcp>=0.2.0",
]

[project.scripts]
liberado-python-interpreter-mcp = "liberado_python_interpreter.__main__:main"

[project.optional-dependencies]
http = ["turbomcp[http]"]

[tool.setuptools.packages.find]
where = ["src"]
