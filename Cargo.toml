[package]
name = "liberado-python-interpreter-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "liberado-python-interpreter-mcp"
path = "src/main.rs"

[lib]
name = "liberado_python_interpreter_mcp"
path = "src/lib.rs"

[dependencies]
turbomcp = { version = "3", features = ["http"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
which = "7"

[features]
default = []
sandbox = []

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
